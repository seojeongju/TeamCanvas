[package]
name = "teamcanvas-desktop"
version = "0.1.0"
description = "TeamCanvas Windows desktop shell (close to tray)"
authors = ["TeamCanvas"]
edition = "2021"

[lib]
name = "teamcanvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
